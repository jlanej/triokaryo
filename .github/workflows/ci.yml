name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bcftools (for the merge test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bcftools tabix
      - name: Install (with test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Run tests
        run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
      - name: Build image (load locally for testing)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: triokaryo:ci
      - name: Test the image on the mock
        run: |
          mkdir -p ci_out && chmod 777 ci_out
          docker run --rm -v "$PWD/ci_out:/data" -w /data triokaryo:ci mock --out /data/mock
          docker run --rm -v "$PWD/ci_out:/data" -w /data triokaryo:ci run --vcf /data/mock/mock.vcf.gz --pedigree /data/mock/mock.trios.tsv \
            --child KID --gc-track /data/mock/gc.tsv --events /data/mock/events.external.tsv --out /data/KID --no-figures
          grep -q "gain" ci_out/KID/events.tsv
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
