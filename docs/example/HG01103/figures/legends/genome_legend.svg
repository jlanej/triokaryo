   <g id="text_1">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 12.017871)">LRR per bin: log2 of the bin's trimmed-mean depth over the member's autosomal median (GC- and</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 18.548262)">panel-corrected where applicable)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="27.287791" transform="rotate(-0 28.289764 27.287791)">step fit of the track (exact total-variation denoising)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="39.292515" transform="rotate(-0 28.289764 39.292515)">BAF: alt-allele read fraction at the member's heterozygous sites (subsampled)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 38.236458)">phased fraction pooled over a window of sites (depth-weighted): 1/2 with equal homologue copy, 1/2 +/- d</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 44.766849)">along an event with the sign giving the parent (child: below 1/2 the paternal homologue is in excess,</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 51.29724)">above 1/2 the maternal; parent: below 1/2 the event lies on the untransmitted homologue, above 1/2 on</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 57.82763)">the transmitted one); hollow where the window deviates in two or more members (paralogy; excluded</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 64.358021)">from fits and scan)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="63.301964" transform="rotate(-0 28.289764 63.301964)">called gain (line at the segment's mean LRR)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="75.306747" transform="rotate(-0 28.289764 75.306747)">called loss</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="87.311413" transform="rotate(-0 28.289764 87.311413)">called copy-neutral event: loss of heterozygosity or uniparental heterodisomy (drawn at LRR 0)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="99.316137" transform="rotate(-0 28.289764 99.316137)">child's depth over the parents' mean depth per site, median per bin (within-family difference)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 108.055725)">child's maternal copy number: the LRR step fit's copy number (2 x 2^LRR) times the maternal fraction's</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 114.586116)">step fit</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="123.325586" transform="rotate(-0 28.289764 123.325586)">child's paternal copy number, likewise</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="135.330311" transform="rotate(-0 28.289764 135.330311)">event supplied with --events (bracket above the track)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="147.335094" transform="rotate(-0 28.289764 147.335094)">reference lines: LRR 0; BAF 1/2, 1/3 and 2/3; the centromere</text>
   </g>
  </g>
 </g>
