   <g id="text_1">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 12.017871)">LRR: log2 of the bin's median depth over the member's autosomal median (GC-corrected where a GC</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 18.548262)">track was given)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 24.022596)">the step fit of the track (total-variation denoising): a piecewise-constant reading in which every jump has</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 30.552986)">to earn its height</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="39.292515" transform="rotate(-0 28.289764 39.292515)">BAF: the alt-allele fraction at the member's heterozygous sites (a sample of them)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 34.971322)">the phased fraction pooled over a window of sites (depth-weighted): at 1/2 where the homologues are</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 41.501712)">equal, 1/2 + d or 1/2 - d along an event, the sign the parent of origin - in the child, below one half the</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 48.032103)">paternal homologue is in excess (a paternal gain, a maternal copy lost), above one half the maternal; in a</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 54.562494)">parent, below one half the event lies on the homologue not passed to the child, above one half on the one</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 61.092884)">passed; hollow where the window is parted in two or more members (paralogy), which the fits and the</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 67.623275)">scan leave out</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="63.301964" transform="rotate(-0 28.289764 63.301964)">a called gain (line at the segment's mean LRR)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="75.306747" transform="rotate(-0 28.289764 75.306747)">a called loss</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="87.311413" transform="rotate(-0 28.289764 87.311413)">a called copy-neutral event - a loss of heterozygosity, or a uniparental heterodisomy (drawn at zero)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="99.316137" transform="rotate(-0 28.289764 99.316137)">the child over the parents' mean depth, site by site, per bin (the within-family difference)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="111.320862" transform="rotate(-0 28.289764 111.320862)">the child's maternal copies: the LRR step fit's copies (2 x 2^LRR) times the maternal fraction's step fit</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="123.325586" transform="rotate(-0 28.289764 123.325586)">the child's paternal copies, the same way</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="135.330311" transform="rotate(-0 28.289764 135.330311)">an event given from elsewhere (--events), drawn above the track</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="147.335094" transform="rotate(-0 28.289764 147.335094)">reference lines: zero LRR, BAF at 1/2, 1/3 and 2/3; the centromere</text>
   </g>
  </g>
 </g>
