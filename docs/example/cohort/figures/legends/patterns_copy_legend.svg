   <g id="text_1">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 12.017871)">LRR per bin: log2 of the bin's median depth over the member's autosomal median (GC- and</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 18.548262)">panel-corrected where applicable)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="27.203842" transform="rotate(-0 28.289764 27.203842)">step fit of the track (exact total-variation denoising)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="39.124617" transform="rotate(-0 28.289764 39.124617)">BAF: alt-allele read fraction at the member's heterozygous sites (subsampled)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="51.045392" transform="rotate(-0 28.289764 51.045392)">phased fraction at one site: maternal allele (child) or transmitted allele (parent), reference bias removed</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 49.905386)">phased fraction pooled over a window of sites (depth-weighted): 1/2 with equal homologue copy, 1/2 +/- d</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 56.435777)">along an event with the sign giving the parent (child: below 1/2 the paternal homologue is in excess,</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 62.966168)">above 1/2 the maternal; parent: below 1/2 the event lies on the untransmitted homologue, above 1/2 on</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 69.496558)">the transmitted one); hollow where the window deviates in two or more members (paralogy; excluded from</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 76.026949)">fits and scan)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 68.356552)">child's maternal fraction at sites where the father is homozygous and the mother heterozygous; departs</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 74.886943)">from the main track where the child carries two different maternal homologues (maternal meiotic trisomy</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 81.417333)">or heterodisomy) and rejoins it after a crossover</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 83.542523)">the same at sites where the mother is homozygous and the father heterozygous; departs where the child</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 90.072913)">carries two different paternal homologues</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 95.463357)">child's maternal copy number: the LRR step fit's copy number (2 x 2^LRR) times the maternal fraction's</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 101.993747)">step fit</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="110.649269" transform="rotate(-0 28.289764 110.649269)">child's paternal copy number, likewise</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="122.570044" transform="rotate(-0 28.289764 122.570044)">called gain (line at the segment's mean LRR)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="134.490878" transform="rotate(-0 28.289764 134.490878)">called loss</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="146.411595" transform="rotate(-0 28.289764 146.411595)">called copy-neutral event: loss of heterozygosity or uniparental heterodisomy (drawn at LRR 0)</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="158.332428" transform="rotate(-0 28.289764 158.332428)">reference lines: LRR 0; BAF 1/2, 1/3 and 2/3; the centromere</text>
   </g>
  </g>
 </g>
