   <g id="text_1">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 12.017871)">LRR: log2 of the bin's median depth over the member's autosomal median (GC-corrected where a GC</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 18.548262)">track was given)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 23.938646)">the step fit of the track (total-variation denoising): a piecewise-constant reading in which every jump has</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 30.469037)">to earn its height</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="39.124617" transform="rotate(-0 28.289764 39.124617)">BAF: the alt-allele fraction at the member's heterozygous sites (a sample of them)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 47.780197)">the phased fraction at one heterozygous site: of the maternal allele (the child), of the allele passed to the</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 54.310588)">child (a parent); reference bias out</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 46.64025)">the phased fraction pooled over a window of sites (depth-weighted): at 1/2 where the homologues are</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 53.17064)">equal, 1/2 + d or 1/2 - d along an event, the sign the parent of origin - in the child, below one half the</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 59.701031)">paternal homologue is in excess (a paternal gain, a maternal copy lost), above one half the maternal; in a</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 66.231421)">parent, below one half the event lies on the homologue not passed to the child, above one half on the one</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 72.761812)">passed; hollow where the window is parted in two or more members (paralogy), which the fits and the</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 79.292203)">scan leave out</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 68.356552)">the child's maternal fraction read at the sites where the father is homozygous and the mother</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 74.886943)">heterozygous: it leaves the main track where the child carries two different maternal homologues (a</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 81.417333)">meiotic maternal trisomy or heterodisomy) and returns where a crossover made them one</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 83.542523)">the same at the sites where the mother is homozygous and the father heterozygous: it leaves the main</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(28.289764 90.072913)">track where the child carries two different paternal homologues</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="98.728493" transform="rotate(-0 28.289764 98.728493)">the child's maternal copies: the LRR step fit's copies (2 x 2^LRR) times the maternal fraction's step fit</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="110.649269" transform="rotate(-0 28.289764 110.649269)">the child's paternal copies, the same way</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="122.570044" transform="rotate(-0 28.289764 122.570044)">a called gain (line at the segment's mean LRR)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="134.490878" transform="rotate(-0 28.289764 134.490878)">a called loss</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="146.411595" transform="rotate(-0 28.289764 146.411595)">a called copy-neutral event - a loss of heterozygosity, or a uniparental heterodisomy (drawn at zero)</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.289764" y="158.332428" transform="rotate(-0 28.289764 158.332428)">reference lines: zero LRR, BAF at 1/2, 1/3 and 2/3; the centromere</text>
   </g>
  </g>
 </g>
